<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a9dff"/>
      <stop offset="1" stop-color="#2d88ff"/>
    </linearGradient>
    <linearGradient id="faviconCloudGradient" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F4FF"/>
    </linearGradient>
    <linearGradient id="faviconArrowGradient" x1="32" y1="28" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d88ff"/>
      <stop offset="1" stop-color="#1a6fd4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#faviconGradient)"/>

  <!-- Cloud -->
  <ellipse cx="32" cy="28" rx="16" ry="8" fill="url(#faviconCloudGradient)"/>
  <circle cx="20" cy="26" r="8" fill="url(#faviconCloudGradient)"/>
  <circle cx="44" cy="26" r="8" fill="url(#faviconCloudGradient)"/>
  <circle cx="32" cy="20" r="9" fill="url(#faviconCloudGradient)"/>
  <ellipse cx="32" cy="25" rx="12" ry="8" fill="url(#faviconCloudGradient)"/>

  <!-- Download Arrow -->
  <path d="M32 34 L32 48" stroke="url(#faviconArrowGradient)" stroke-width="3" stroke-linecap="round"/>
  <path d="M27 44 L32 50 L37 44" stroke="url(#faviconArrowGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Left curved conversion arrow -->
  <path d="M22 42 Q16 42 16 48 Q16 54 24 54" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M22 52 L24 55 L27 53" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Right curved conversion arrow -->
  <path d="M42 42 Q48 42 48 48 Q48 54 40 54" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M42 52 L40 55 L37 53" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
</svg>
