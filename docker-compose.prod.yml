services:
  # Convex Backend with sharp support
  backend:
    build:
      context: .
      dockerfile: Dockerfile.convex
    restart: unless-stopped
    ports:
      - "${CONVEX_PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - convex_data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      - RUST_LOG=${RUST_LOG:-info}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 10s
      start_period: 30s
      retries: 3

  # Convex Dashboard
  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:3210}
    depends_on:
      backend:
        condition: service_healthy

  # Frontend App
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - VITE_CONVEX_URL=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
    depends_on:
      backend:
        condition: service_healthy

  # Deploy Convex functions (runs once on startup, then exits)
  deploy:
    image: node:20-slim
    working_dir: /app
    restart: "no"
    volumes:
      - ./convex:/app/convex
      - ./package.json:/app/package.json
    environment:
      - CONVEX_SELF_HOST_URL=${CONVEX_SELF_HOST_URL:-http://backend:3210}
      - CONVEX_ADMIN_KEY=${CONVEX_ADMIN_KEY}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-6791}
    command: >
      sh -c "
        echo '========================================';
        echo '  Convex Deploy Service';
        echo '========================================';
        echo '';
        if [ -z \"$$CONVEX_ADMIN_KEY\" ]; then
          echo '❌ CONVEX_ADMIN_KEY is not set!';
          echo '';
          echo 'To get your admin key:';
          echo '  1. Open dashboard: http://localhost:'$$DASHBOARD_PORT;
          echo '  2. Go to Settings → Admin Key';
          echo '  3. Add to .env: CONVEX_ADMIN_KEY=your-key';
          echo '  4. Restart: docker compose -f docker-compose.prod.yml up -d deploy';
          echo '';
          exit 1;
        fi;
        echo '✓ Admin Key: '$$CONVEX_ADMIN_KEY;
        echo '✓ Backend URL: '$$CONVEX_SELF_HOST_URL;
        echo '';
        echo 'Installing convex CLI...';
        npm install convex --silent;
        echo 'Deploying functions...';
        npx convex deploy --url $$CONVEX_SELF_HOST_URL --admin-key $$CONVEX_ADMIN_KEY --cmd 'echo done';
        echo '';
        echo '✓ Deployment complete!';
        echo '========================================';
      "
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex_data:
