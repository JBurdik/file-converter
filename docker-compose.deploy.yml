# Run this to deploy Convex functions to your self-hosted backend
# Usage: docker compose -f docker-compose.deploy.yml up --build

services:
  deploy:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    environment:
      - CONVEX_SELF_HOST_URL=${CONVEX_SELF_HOST_URL:-http://host.docker.internal:3210}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "npx convex deploy --url $${CONVEX_SELF_HOST_URL} --admin-key $${CONVEX_ADMIN_KEY:-} --cmd 'echo deployed'"
